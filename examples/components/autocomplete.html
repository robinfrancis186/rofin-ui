<form class="rf-card rf-stack" data-demo-form method="dialog">
  <label class="rf-field"><span class="rf-label">Project topic</span><input class="rf-input" name="topic" list="topic-suggestions" autocomplete="off" maxlength="80" aria-describedby="topic-help"><span class="rf-help" id="topic-help">Choose a suggestion or enter your own topic.</span></label>
  <datalist id="topic-suggestions"><option value="Accessibility"></option><option value="Analytics"></option><option value="Design systems"></option><option value="Documentation"></option><option value="Web performance"></option></datalist>
  <div class="rf-cluster"><button class="rf-button" type="submit">Save topic</button><button class="rf-button rf-button--outline" type="reset">Reset topic</button></div>
</form>
