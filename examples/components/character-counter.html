<form class="rf-card rf-stack" data-demo-form style="max-width:34rem">
  <p class="rf-eyebrow">Make every word count.</p>
  <h3 class="rf-card__title">A little introduction.</h3>
  <div class="rf-field" data-rf-counter>
    <label class="rf-label" for="profile-bio">Your bio</label>
    <textarea class="rf-textarea" id="profile-bio" name="bio" maxlength="160" rows="3" placeholder="What do you love making?" aria-describedby="bio-help bio-count"></textarea>
    <div class="rf-cluster" style="justify-content:space-between"><p class="rf-help" id="bio-help">Keep it short. Make it you.</p><p class="rf-help rf-count" id="bio-count" data-rf-count>Up to 160 characters.</p></div>
  </div>
  <div class="rf-cluster"><button class="rf-button" type="submit">Preview profile</button><button class="rf-button rf-button--ghost" type="reset">Start over</button></div>
</form>
