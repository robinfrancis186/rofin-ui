<form class="rf-card rf-stack" data-demo-form style="max-width:30rem">
  <p class="rf-eyebrow">A small detail. A little less friction.</p>
  <h3 class="rf-card__title">See what you’re typing.</h3>
  <div class="rf-field" data-rf-password>
    <label class="rf-label" for="reveal-password">Password</label>
    <div class="rf-input-action">
      <input class="rf-input" id="reveal-password" name="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="reveal-help">
      <button class="rf-button rf-button--outline" type="button" data-rf-password-toggle aria-label="Show password" aria-controls="reveal-password" aria-pressed="false" hidden>Show</button>
    </div>
    <p class="rf-help" id="reveal-help">Use a sample password of at least 8 characters. This demo sends nothing.</p>
  </div>
  <div class="rf-cluster"><button class="rf-button" type="submit">Try the form</button><button class="rf-button rf-button--ghost" type="reset">Reset</button></div>
</form>
