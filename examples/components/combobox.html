<form class="rf-card rf-stack" data-demo-form method="dialog">
  <div class="rf-field" data-rf-combobox>
    <label class="rf-label" for="project-template">Project template</label>
    <select class="rf-select" id="project-template" name="template" required aria-describedby="template-help">
      <option value="">Choose a template</option><option value="website" selected>Website launch</option><option value="dashboard">Analytics dashboard</option><option value="store">Online store</option><option value="mobile" disabled>Mobile app · coming soon</option>
    </select>
    <p class="rf-help" id="template-help">Type to search, use arrow keys, then Enter to choose. Escape restores your last choice.</p>
  </div>
  <div class="rf-cluster"><button class="rf-button" type="submit">Use template</button><button class="rf-button rf-button--outline" type="reset">Reset template</button></div>
</form>
