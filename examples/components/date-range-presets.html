<form class="rf-card rf-stack" data-rf-date-range data-rf-date-presets data-rf-today="2026-10-02" data-demo-form>
  <fieldset class="rf-fieldset"><legend>Reporting period</legend><div class="rf-grid" style="--rf-column:12rem"><label class="rf-field"><span class="rf-label">Start date</span><input class="rf-input" type="date" name="start" value="2026-09-01" data-rf-date-start required></label><label class="rf-field"><span class="rf-label">End date</span><input class="rf-input" type="date" name="end" value="2026-09-30" data-rf-date-end required></label></div></fieldset>
  <div class="rf-cluster" aria-label="Date shortcuts"><button class="rf-button rf-button--outline rf-button--small" type="button" data-rf-date-preset="today">Today</button><button class="rf-button rf-button--outline rf-button--small" type="button" data-rf-date-preset="week">Last 7 days</button><button class="rf-button rf-button--outline rf-button--small" type="button" data-rf-date-preset="month">This month</button><button class="rf-button rf-button--outline rf-button--small" type="button" data-rf-date-preset="previous-month">Previous month</button></div>
  <p class="rf-help" role="status">Example today: 2 October 2026. Presets include both start and end dates.</p>
  <div class="rf-cluster"><button class="rf-button" type="submit">Apply period</button><button class="rf-button rf-button--outline" type="reset">Reset period</button></div>
</form>
