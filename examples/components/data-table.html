<section class="rf-stack" data-rf-data-table aria-labelledby="work-table-title">
  <div class="rf-cluster" style="justify-content:space-between">
    <div><p class="rf-eyebrow">Less searching. More doing.</p><h3 id="work-table-title" style="margin:0">The work ahead.</h3></div>
    <div class="rf-field"><label class="rf-label" for="work-search">Find a project</label><input class="rf-input" id="work-search" type="search" placeholder="Name, owner, or status…" data-rf-table-search></div>
  </div>
  <div class="rf-table-wrap" tabindex="0" role="region" aria-label="Project list">
    <table class="rf-table">
      <caption>Sample projects. Use column buttons to sort; click again to reverse.</caption>
      <thead><tr>
        <th scope="col"><button class="rf-button rf-button--ghost" type="button" data-rf-sort="text">Project <span aria-hidden="true" data-rf-sort-icon>↕</span></button></th>
        <th scope="col"><button class="rf-button rf-button--ghost" type="button" data-rf-sort="text">Owner <span aria-hidden="true" data-rf-sort-icon>↕</span></button></th>
        <th scope="col">Status</th>
        <th scope="col"><button class="rf-button rf-button--ghost" type="button" data-rf-sort="number">Tasks <span aria-hidden="true" data-rf-sort-icon>↕</span></button></th>
      </tr></thead>
      <tbody>
        <tr><th scope="row">Studio website</th><td>Robin</td><td><span class="rf-badge" data-variant="success">Published</span></td><td>12</td></tr>
        <tr><th scope="row">Mobile journal</th><td>Jamie</td><td><span class="rf-badge" data-variant="warning">In progress</span></td><td>3</td></tr>
        <tr><th scope="row">Brand refresh</th><td>Alex</td><td><span class="rf-badge">Draft</span></td><td>20</td></tr>
        <tr><th scope="row">Component library</th><td>Robin</td><td><span class="rf-badge" data-variant="warning">In progress</span></td><td>8</td></tr>
      </tbody>
    </table>
  </div>
  <p class="rf-help" role="status" data-rf-table-status>Four sample projects.</p>
</section>
