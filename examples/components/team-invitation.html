<section class="rf-card rf-stack" data-rf-team-accept aria-labelledby="team-invitation-title">
  <div><p class="rf-eyebrow">Good work starts together.</p><h3 id="team-invitation-title">Join <span data-rf-invite-team>Studio</span></h3><p class="rf-muted">You were invited as <strong data-rf-invite-role>Viewer</strong>.</p></div>
  <form class="rf-stack" method="dialog" data-rf-invite-accept-form>
    <label class="rf-field"><span class="rf-label">Invited email</span><input class="rf-input" type="email" name="email" value="avery@example.com" readonly></label>
    <label class="rf-field"><span class="rf-label">Your display name</span><input class="rf-input" name="name" maxlength="80" autocomplete="name" required></label>
    <p class="rf-alert" data-variant="danger" role="alert" data-rf-invite-error hidden></p>
    <button class="rf-button" type="submit" data-rf-invite-join>Join sample workspace</button><button class="rf-button rf-button--ghost" type="reset">Clear display name</button>
  </form>
  <p class="rf-help" role="status" data-rf-invite-status></p><p class="rf-help" data-rf-invite-note>This gallery previews joining a page-session sample. No account is created. Real invitation links must be validated by your application server.</p>
</section>
