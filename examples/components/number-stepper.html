<div class="rf-stack">
  <label class="rf-label" for="quantity">
    Quantity
  </label>
  <div class="rf-stepper" data-rf-stepper>
    <button class="rf-button rf-button--outline" type="button" data-rf-stepper-move="-1" aria-label="Decrease quantity">
      −
    </button>
    <input class="rf-input" id="quantity" type="number" min="1" max="10" step="1" value="2">
    <button class="rf-button rf-button--outline" type="button" data-rf-stepper-move="1" aria-label="Increase quantity">
      +
    </button>
  </div>
  <p class="rf-help">
    Between 1 and 10. You can also type a quantity.
  </p>
</div>
