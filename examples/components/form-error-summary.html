<form class="rf-card rf-stack" data-rf-validation data-demo-form>
  <div class="rf-alert" data-variant="danger" data-rf-errors role="alert" tabindex="-1" hidden><strong>Check these fields</strong><ul></ul></div>
  <label class="rf-field" for="summary-name"><span class="rf-label">Your name</span><input class="rf-input" id="summary-name" name="name" autocomplete="name" required maxlength="80"></label>
  <label class="rf-field" for="summary-email"><span class="rf-label">Email address</span><input class="rf-input" id="summary-email" name="email" type="email" autocomplete="email" required aria-describedby="summary-email-help"><span class="rf-help" id="summary-email-help">Use an address you can receive messages at.</span></label>
  <div class="rf-cluster"><button class="rf-button" type="submit">Check form</button><button class="rf-button rf-button--outline" type="reset">Reset form</button></div>
</form>
