<form class="rf-card rf-stack" data-rf-date-range data-demo-form method="dialog">
  <fieldset class="rf-fieldset"><legend>Reporting period</legend><div class="rf-grid" style="--rf-column:12rem">
    <label class="rf-field"><span class="rf-label">Start date</span><input class="rf-input" type="date" name="start" value="2026-09-01" data-rf-date-start required></label>
    <label class="rf-field"><span class="rf-label">End date</span><input class="rf-input" type="date" name="end" value="2026-09-30" data-rf-date-end required></label>
  </div><p class="rf-help" style="margin-top:1rem">The end date must be on or after the start date.</p></fieldset>
  <div class="rf-cluster"><button class="rf-button" type="submit">Apply dates</button><button class="rf-button rf-button--outline" type="reset">Reset dates</button></div>
</form>
