<form class="rf-card rf-stack" data-demo-form>
  <div class="rf-calendar rf-stack" data-rf-calendar data-rf-locale="en-GB">
    <label class="rf-field"><span class="rf-label">Launch date</span><input class="rf-input" type="date" name="date" value="2026-10-02" min="2026-09-01" max="2027-12-31" required aria-describedby="calendar-help"></label>
    <div data-rf-calendar-controls hidden><div class="rf-calendar__toolbar"><button class="rf-button rf-button--outline rf-button--small" type="button" data-rf-calendar-month="-1" aria-label="Previous month">←</button><strong data-rf-calendar-title></strong><button class="rf-button rf-button--outline rf-button--small" type="button" data-rf-calendar-month="1" aria-label="Next month">→</button></div><table class="rf-calendar__grid" data-rf-calendar-grid></table></div>
    <p class="rf-help" id="calendar-help">Arrow keys move by day or week. Page Up/Down changes month, Home/End moves within the week. Enter selects.</p>
  </div>
  <div class="rf-cluster"><button class="rf-button" type="submit">Save date</button><button class="rf-button rf-button--outline" type="reset">Reset date</button></div>
</form>
