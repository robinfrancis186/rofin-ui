<form method="dialog" class="rf-stack" data-rf-upload-form>
  <section class="rf-stack rf-upload-queue" data-rf-upload-queue data-rf-max-size="8388608" data-rf-max-files="10" aria-label="Project upload queue">
    <div><h3>Give your files a place.</h3><p class="rf-muted">Review the queue, keep what matters, and send it when you're ready.</p></div>
    <div class="rf-upload" data-rf-drop-zone>
      <label class="rf-label" for="queue-files">Files to add</label>
      <p class="rf-help" id="queue-files-help">Choose or drop PNG, JPEG, WebP, PDF or text files. Up to 10 files, 8 MB each.</p>
      <input id="queue-files" type="file" accept=".png,.jpg,.jpeg,.webp,.pdf,.txt" multiple aria-describedby="queue-files-help">
    </div>
    <p class="rf-help" data-rf-upload-demo-note>Files stay on your device until you choose Upload. Transfers require your application's upload callback.</p>
    <ol class="rf-upload-items" data-rf-upload-items aria-label="Selected files"></ol>
  </section>
  <div><button type="reset" class="rf-button rf-button--outline rf-button--small">Reset file queue</button></div>
</form>
