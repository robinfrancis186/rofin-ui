<div data-rf-compare class="rf-stack">
  <div class="rf-compare" role="img" aria-label="Before and after design comparison">
    <div class="rf-compare__before"><strong style="font-size:clamp(1.5rem,5vw,3rem)">An idea.<br>A blank canvas.</strong></div>
    <div class="rf-compare__after"><strong style="font-size:clamp(1.5rem,5vw,3rem)">An idea.<br>Brought to life.</strong></div>
    <span class="rf-compare__label">Before</span><span class="rf-compare__label rf-compare__label--after">After</span>
  </div>
  <label class="rf-field"><span class="rf-label">Comparison position</span><input class="rf-range" type="range" min="0" max="100" value="50"></label>
</div>
