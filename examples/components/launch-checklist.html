<form class="rf-card rf-stack" data-rf-check-progress style="max-width:34rem" method="dialog">
  <div class="rf-cluster" style="justify-content:space-between"><p class="rf-eyebrow">Small steps. Something real.</p><span class="rf-badge">Your launch plan</span></div>
  <h3 class="rf-card__title">Bring your idea into the world.</h3>
  <label class="rf-help" for="launch-progress">Launch preparation</label>
  <progress class="rf-progress" id="launch-progress" value="1" max="3">1 of 3 steps complete</progress>
  <ul class="rf-launch-list">
    <li><label><input type="checkbox" name="launch" value="idea" checked><span><strong>Give your idea a name</strong><small>A good beginning is a clear direction.</small></span></label></li>
    <li><label><input type="checkbox" name="launch" value="build"><span><strong>Make your first version</strong><small>Pick your components. Build one useful thing.</small></span></label></li>
    <li><label><input type="checkbox" name="launch" value="share"><span><strong>Share it with someone</strong><small>A little feedback goes a long way.</small></span></label></li>
  </ul>
  <p class="rf-help" role="status" data-rf-check-status>1 of 3 steps complete</p>
  <button class="rf-button rf-button--ghost" type="reset">Reset checklist</button>
</form>
