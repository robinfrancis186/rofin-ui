<div class="rf-stack">
  <div class="rf-field">
    <label class="rf-label" for="input-name">Your name</label>
    <input class="rf-input" id="input-name" name="name" autocomplete="name" placeholder="Robin Francis">
  </div>
  <div class="rf-field">
    <label class="rf-label" for="input-email">Email address</label>
    <input class="rf-input" id="input-email" type="email" autocomplete="email" aria-describedby="email-help" placeholder="you@example.com">
    <p class="rf-help" id="email-help">We’ll only use this to contact you about your account.</p>
  </div>
</div>
