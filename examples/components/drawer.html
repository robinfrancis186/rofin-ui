<button class="rf-button rf-button--outline" type="button" data-rf-dialog-open="settings-drawer">Workspace settings</button>
<dialog class="rf-dialog rf-dialog--drawer" id="settings-drawer" aria-labelledby="drawer-title">
  <h2 class="rf-dialog__title" id="drawer-title">Workspace settings</h2>
  <p class="rf-muted">Give your workspace a name that feels like you.</p>
  <div class="rf-field"><label class="rf-label" for="drawer-name">Workspace name</label><input class="rf-input" id="drawer-name" value="Studio" autofocus></div>
  <div class="rf-dialog__actions"><button class="rf-button" type="button" data-rf-dialog-close>Done</button></div>
</dialog>
