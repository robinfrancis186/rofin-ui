<!doctype html>
<html lang="en" data-rf-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rofin interaction fixture</title><link rel="stylesheet" href="../src/rofin.css"><link rel="stylesheet" href="../src/effects.css"></head>
<body class="rf-scope"><main style="max-width:40rem;margin:3rem auto;padding:1rem"><h1>Interaction fixture</h1>
<div data-rf-tabs class="rf-tabs" id="test-tabs"><div role="tablist" aria-label="Test tabs"><button type="button" role="tab" aria-selected="true">One</button><button type="button" role="tab">Two</button><button type="button" role="tab" disabled>Disabled</button><button type="button" role="tab">Four</button></div><div role="tabpanel">First panel</div><div role="tabpanel">Second panel</div><div role="tabpanel">Disabled panel</div><div role="tabpanel">Fourth panel</div></div>
<div data-rf-dropdown><button class="rf-button" id="menu-trigger" type="button" popovertarget="test-menu">Actions</button><div id="test-menu" class="rf-menu" popover role="menu" aria-label="Test actions"><button role="menuitem" type="button">Alpha</button><button role="menuitem" type="button" disabled>Disabled action</button><button role="menuitem" type="button">Beta</button><button role="menuitem" type="button">Gamma</button></div></div>
<button type="button" class="rf-button" data-rf-dialog-open="test-dialog">Open modal</button><dialog id="test-dialog" class="rf-dialog" aria-labelledby="modal-title" data-rf-backdrop-close><h2 id="modal-title">Confirm your choice</h2><label class="rf-field">Name<input class="rf-input" autofocus></label><button class="rf-button" type="button" data-rf-dialog-close>Close modal</button></dialog>
<span class="rf-tooltip"><button class="rf-button" type="button" aria-describedby="test-tip">Hint</button><span class="rf-tooltip__content" id="test-tip" role="tooltip">Helpful description</span></span>
<form><div class="rf-upload" data-rf-upload><label for="test-files">Files</label><input id="test-files" type="file" multiple><ul class="rf-upload__files" data-rf-file-list aria-live="polite"></ul></div><button type="reset">Reset files</button></form>
<button id="toast-trigger" class="rf-button" type="button">Notification source</button>
<div id="dynamic"></div>
</main><script type="module">import {init} from '../src/js/index.js'; init(); window.rfReady=true;</script></body></html>
