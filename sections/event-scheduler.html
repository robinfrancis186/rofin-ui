<section class="rf-stack" data-rf-scheduler aria-label="Event scheduler">
  <div><h3>Make time for what matters.</h3><p class="rf-muted">Create and edit a daily schedule. Changes last for this page session.</p></div>
  <form class="rf-card rf-stack" data-rf-event-form data-rf-validation data-demo-form method="dialog">
    <div class="rf-alert" data-variant="danger" data-rf-errors role="alert" tabindex="-1" hidden><strong>Check your event</strong><ul></ul></div>
    <input type="hidden" name="eventId" value="">
    <label class="rf-field"><span class="rf-label">Event title</span><input class="rf-input" name="title" required maxlength="120"></label>
    <label class="rf-field"><span class="rf-label">Event date</span><input class="rf-input" type="date" name="date" value="2026-10-02" required></label>
    <div class="rf-grid" style="--rf-column:10rem"><label class="rf-field"><span class="rf-label">Start time</span><input class="rf-input" type="time" name="start" value="09:00" required></label><label class="rf-field"><span class="rf-label">End time</span><input class="rf-input" type="time" name="end" value="09:30" required></label></div>
    <div class="rf-cluster"><button class="rf-button" type="submit" data-rf-event-save>Add event</button><button class="rf-button rf-button--outline" type="reset">Cancel edit</button></div>
  </form>
  <p class="rf-help" role="status" data-rf-event-status>1 event scheduled. Times use your workspace’s time zone.</p>
  <ul class="rf-stack" data-rf-events style="list-style:none;margin:0;padding:0"><li class="rf-card rf-stack" data-rf-event-id="kickoff" data-rf-event-date="2026-10-02" data-rf-event-start="10:00" data-rf-event-end="10:30"><strong data-rf-event-title>Project kickoff</strong><time datetime="2026-10-02T10:00">2026-10-02 · 10:00–10:30</time></li></ul>
</section>
