<form class="rf-card rf-stack" data-demo-form method="dialog">
  <div><h3 class="rf-card__title">A workspace that feels like you.</h3><p class="rf-muted">Sample account settings. Save and reset use native form controls.</p></div>
  <div class="rf-grid"><label class="rf-field"><span class="rf-label">Display name</span><input class="rf-input" name="name" value="Robin Francis" autocomplete="name" maxlength="80" required></label><label class="rf-field"><span class="rf-label">Email address</span><input class="rf-input" name="email" type="email" value="robin@example.com" autocomplete="email" required></label></div>
  <label class="rf-field"><span class="rf-label">Time zone</span><select class="rf-select" name="timezone"><option value="Asia/Kolkata">India · Asia/Kolkata</option><option value="Europe/London">United Kingdom · Europe/London</option><option value="America/New_York">United States · America/New_York</option><option value="UTC">UTC</option></select></label>
  <fieldset class="rf-fieldset"><legend>Notifications</legend><div class="rf-stack"><label class="rf-check"><input class="rf-switch" type="checkbox" role="switch" name="updates" checked>Project updates</label><label class="rf-check"><input class="rf-switch" type="checkbox" role="switch" name="digest">Weekly digest</label></div></fieldset>
  <div class="rf-cluster"><button class="rf-button" type="submit">Save preferences</button><button class="rf-button rf-button--outline" type="reset">Discard changes</button></div><p class="rf-help">Preview only. Connect save to your account service.</p>
</form>
