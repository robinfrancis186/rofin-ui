<section class="rf-card rf-auth">
  <h3>
    Welcome back.
  </h3>
  <p class="rf-muted">
    A little closer to your next idea.
  </p>
  <form data-demo-form>
    <label class="rf-field">
      <span class="rf-label">
        Email
      </span>
      <input class="rf-input" type="email" name="email" autocomplete="username" required>
    </label>
    <label class="rf-field">
      <span class="rf-label">
        Password
      </span>
      <input class="rf-input" type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="rf-button" type="submit">
      Sign in
    </button>
  </form>
  <p class="rf-help" style="margin-top:1rem">
    Preview only. Do not enter a real password.
  </p>
</section>
