<section class="rf-card rf-auth">
  <h3>
    Welcome back.
  </h3>
  <p class="rf-muted">
    A little closer to your next idea.
  </p>
  <form data-demo-form method="dialog">
    <label class="rf-field">
      <span class="rf-label">
        Email
      </span>
      <input class="rf-input" type="email" name="email" autocomplete="username" required>
    </label>
    <div class="rf-field" data-rf-password>
      <label class="rf-label" for="signin-password">Password</label>
      <div class="rf-input-action">
        <input class="rf-input" id="signin-password" type="password" name="password" autocomplete="current-password" required>
        <button class="rf-button rf-button--outline rf-button--small" type="button" data-rf-password-toggle aria-label="Show password" aria-controls="signin-password" aria-pressed="false" hidden>Show</button>
      </div>
    </div>
    <button class="rf-button" type="submit">
      Sign in
    </button>
  </form>
  <p class="rf-help" style="margin-top:1rem">
    Preview only. Do not enter a real password.
  </p>
</section>
